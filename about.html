
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>병원소개 - 구리 센트럴병원</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: "Pretendard", sans-serif; }
        .glass-nav { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
        .logo-img { display: block; max-height: 2.5rem; width: auto; }
        .logo-img[src=""], .logo-img:not([src]) { display: none; }
    </style>
</head>
<body class="bg-white text-slate-900">
    <header class="fixed w-full z-50 glass-nav border-b border-slate-100 h-20">
        <div class="container mx-auto px-4 md:px-8 flex items-center justify-between h-full">
            <a href="index.html" class="flex items-center group">
                <div class="flex items-center">
                    <img src="logo.png" alt="구리 센트럴병원" class="logo-img" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                    <div class="logo-fallback hidden items-center space-x-2">
                        <div class="bg-blue-600 p-2 rounded-xl group-hover:bg-blue-700 transition-colors">
                            <i data-lucide="plus" class="text-white w-5 h-5"></i>
                        </div>
                        <div class="flex flex-col">
                            <span class="text-lg font-black text-slate-900 leading-none">구리 <span class="text-blue-600">센트럴병원</span></span>
                            <span class="text-[8px] text-slate-400 font-bold tracking-[0.2em] uppercase">Guri Central Hospital</span>
                        </div>
                    </div>
                </div>
            </a>
            <nav class="hidden lg:flex items-center space-x-8 font-medium">
                <a href="index.html" class="text-slate-600 hover:text-blue-600 transition-colors">홈</a>
                <a href="about.html" class="text-blue-600 font-bold underline decoration-4 underline-offset-8">병원소개</a>
                <a href="services.html" class="text-slate-600 hover:text-blue-600 transition-colors">진료안내</a>
                <a href="doctors.html" class="text-slate-600 hover:text-blue-600 transition-colors">의료진</a>
                <a href="contact.html" class="text-slate-600 hover:text-blue-600 transition-colors">오시는길</a>
            </nav>
        </div>
    </header>

    <main class="pt-32 pb-24">
        <div class="container mx-auto px-4 md:px-8">
            <div class="max-w-4xl mx-auto">
                <h1 class="text-5xl md:text-7xl font-black mb-12 text-slate-900 tracking-tight">당신의 건강을 지키는<br><span class="text-blue-600 underline decoration-blue-200 underline-offset-4">가장 든든한 약속</span></h1>
                <img src="about_main.jpg" alt="병원 상세 소개" class="w-full h-[500px] object-cover rounded-[3.5rem] mb-16 shadow-2xl" onerror="this.src='https://images.unsplash.com/photo-1516549655169-df83a0774514?auto=format&fit=crop&q=80&w=1500'">
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-16 text-xl text-slate-600 leading-relaxed font-medium">
                    <p>구리 센트럴병원은 지역사회의 건강 파수꾼으로서, 대학병원급의 첨단 의료 기술과 사람 중심의 따뜻한 간호를 결합하여 최적의 치유 환경을 제공합니다.</p>
                    <p>모든 환자가 내 가족이라는 마음으로, 정확한 진단과 정직한 치료를 통해 환자분들이 활기찬 일상을 되찾을 때까지 정성을 다하겠습니다.</p>
                </div>
            </div>
        </div>
    </main>
    <script>lucide.createIcons();</script>
</body>
</html>
