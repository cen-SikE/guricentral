
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>구리 센트럴병원 - 마음까지 치유하는 의료 서비스</title>
    
    <!-- CSS 및 폰트 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@100..900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Pretendard', sans-serif;
            scroll-behavior: smooth;
            margin: 0;
        }
        #root:empty {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #f8fafc;
        }
        #root:empty::after {
            content: "의료 서비스를 준비 중입니다...";
            margin-top: 1rem;
            color: #64748b;
            font-weight: 500;
        }
        /* 로딩 애니메이션 */
        #root:empty::before {
            content: "";
            width: 40px;
            height: 40px;
            border: 4px solid #e2e8f0;
            border-top: 4px solid #2563eb;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>

    <!-- React 및 라이브러리 설정 -->
    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.0.0",
    "react-dom": "https://esm.sh/react-dom@19.0.0",
    "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
    "lucide-react": "https://esm.sh/lucide-react@0.460.0?bundle",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/"
  }
}
</script>

    <!-- Babel Standalone (브라우저에서 직접 TSX 변환) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-900">
    <div id="root"></div>

    <!-- 
      data-type="module"을 사용하면 Babel이 import 문을 처리하려고 시도합니다.
      별도의 빌드 도구 없이 작동하게 하기 위해 진입점을 아래와 같이 설정합니다.
    -->
    <script type="text/babel" data-presets="typescript,react" data-type="module">
        import './index.tsx';
    </script>
</body>
</html>
