
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>의료진 - 구리 센트럴병원</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>body { font-family: "Pretendard", sans-serif; }</style>
</head>
<body class="bg-white text-slate-900">
    <header class="fixed w-full z-50 bg-white/95 backdrop-blur-md border-b h-20">
        <div class="container mx-auto px-4 md:px-8 flex items-center justify-between h-full">
            <a href="index.html" class="flex items-center">
                <img src="images/logo.png" alt="구리 센트럴병원 로고" class="h-10 md:h-12 w-auto">
            </a>
            <nav class="hidden lg:flex items-center space-x-8 font-medium">
                <a href="index.html" class="text-slate-600 hover:text-blue-600 transition-colors">홈</a>
                <a href="about.html" class="text-slate-600 hover:text-blue-600 transition-colors">병원소개</a>
                <a href="services.html" class="text-slate-600 hover:text-blue-600 transition-colors">진료안내</a>
                <a href="doctors.html" class="text-blue-600 font-bold underline decoration-4 underline-offset-8">의료진</a>
                <a href="contact.html" class="text-slate-600 hover:text-blue-600 transition-colors">오시는길</a>
            </nav>
        </div>
    </header>

    <main class="pt-32 pb-24">
        <div class="container mx-auto px-4 md:px-8 text-center">
            <h1 class="text-4xl font-bold mb-12">우수한 의료진</h1>
            
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8">
                <div class="group">
                    <div class="rounded-3xl overflow-hidden mb-6 aspect-[3/4] shadow-md">
                        <img src="images/doctor_kim.jpg" alt="김센트럴 원장" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                    </div>
                    <h3 class="text-xl font-bold">김센트럴 원장</h3>
                    <p class="text-blue-600 font-medium">내과 / 심장 질환 전문의</p>
                </div>
                <div class="group">
                    <div class="rounded-3xl overflow-hidden mb-6 aspect-[3/4] shadow-md">
                        <img src="images/doctor_lee.jpg" alt="이지혜 과장" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                    </div>
                    <h3 class="text-xl font-bold">이지혜 과장</h3>
                    <p class="text-blue-600 font-medium">치과 교정 전문의</p>
                </div>
                <div class="group">
                    <div class="rounded-3xl overflow-hidden mb-6 aspect-[3/4] shadow-md">
                        <img src="images/doctor_park.jpg" alt="박민수 과장" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                    </div>
                    <h3 class="text-xl font-bold">박민수 과장</h3>
                    <p class="text-blue-600 font-medium">소아청소년과 전문의</p>
                </div>
                <div class="group">
                    <div class="rounded-3xl overflow-hidden mb-6 aspect-[3/4] shadow-md">
                        <img src="images/doctor_choi.jpg" alt="최유나 과장" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                    </div>
                    <h3 class="text-xl font-bold">최유나 과장</h3>
                    <p class="text-blue-600 font-medium">산부인과 전문의</p>
                </div>
            </div>
        </div>
    </main>
    <script>lucide.createIcons();</script>
</body>
</html>
