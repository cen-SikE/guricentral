
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>진료안내 - 구리 센트럴병원</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: "Pretendard", sans-serif; }
        .glass-nav { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
        .logo-img { display: block; max-height: 2.5rem; width: auto; }
        .logo-img[src=""], .logo-img:not([src]) { display: none; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900">
    <header class="fixed w-full z-50 glass-nav border-b border-slate-100 h-20">
        <div class="container mx-auto px-4 md:px-8 flex items-center justify-between h-full">
            <a href="index.html" class="flex items-center group">
                <div class="flex items-center">
                    <img src="logo.png" alt="구리 센트럴병원" class="logo-img" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                    <div class="logo-fallback hidden items-center space-x-2">
                        <div class="bg-blue-600 p-2 rounded-xl group-hover:bg-blue-700 transition-colors">
                            <i data-lucide="plus" class="text-white w-5 h-5"></i>
                        </div>
                        <div class="flex flex-col">
                            <span class="text-lg font-black text-slate-900 leading-none">구리 <span class="text-blue-600">센트럴병원</span></span>
                            <span class="text-[8px] text-slate-400 font-bold tracking-[0.2em] uppercase">Guri Central Hospital</span>
                        </div>
                    </div>
                </div>
            </a>
            <nav class="hidden lg:flex items-center space-x-8 font-medium">
                <a href="index.html" class="text-slate-600 hover:text-blue-600 transition-colors">홈</a>
                <a href="about.html" class="text-slate-600 hover:text-blue-600 transition-colors">병원소개</a>
                <a href="services.html" class="text-blue-600 font-bold underline decoration-4 underline-offset-8">진료안내</a>
                <a href="doctors.html" class="text-slate-600 hover:text-blue-600 transition-colors">의료진</a>
                <a href="contact.html" class="text-slate-600 hover:text-blue-600 transition-colors">오시는길</a>
            </nav>
        </div>
    </header>

    <main class="pt-32 pb-24">
        <div class="container mx-auto px-4 md:px-8">
            <div class="text-center mb-24">
                <h1 class="text-5xl md:text-6xl font-black mb-8 tracking-tighter">진료 과목 전문 센터</h1>
                <p class="text-slate-500 text-2xl font-medium">환자 개인별 맞춤 치료를 위한 최상의 의료 서비스</p>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-12">
                <div class="bg-white p-12 rounded-[3.5rem] shadow-sm hover:shadow-2xl transition-all border border-slate-100">
                    <div class="flex items-center mb-10">
                        <div class="bg-blue-600 text-white p-5 rounded-[2rem] shadow-xl shadow-blue-200 mr-8"><i data-lucide="smile" class="w-12 h-12"></i></div>
                        <h3 class="text-4xl font-black">치과 센터</h3>
                    </div>
                    <ul class="space-y-5 text-slate-600 text-xl font-medium">
                        <li class="flex items-center"><i data-lucide="plus-circle" class="mr-3 text-blue-500 w-6 h-6"></i> 고난도 임플란트 및 재수술</li>
                        <li class="flex items-center"><i data-lucide="plus-circle" class="mr-3 text-blue-500 w-6 h-6"></i> 디지털 교정 및 심미 보철</li>
                        <li class="flex items-center"><i data-lucide="plus-circle" class="mr-3 text-blue-500 w-6 h-6"></i> 무통 사랑니 발치 시스템</li>
                    </ul>
                </div>
                <!-- ... 추가 진료과목들 ... -->
            </div>
        </div>
    </main>
    <script>lucide.createIcons();</script>
</body>
</html>
